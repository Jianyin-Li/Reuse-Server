name: ${INSTANCE:-reuse-server}

services:
  reuse-server:
    image: ${IMAGE:-reuse-server:trixie}

    # 不写 container_name：compose 自动命名为 <项目名>-reuse-server-1，天然不冲突
    hostname: ${TS_HOSTNAME:-reuse-server}

    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-reuse-server}
      TS_USERSPACE: ${TS_USERSPACE:-false}
      TS_ACCEPT_DNS: ${TS_ACCEPT_DNS:-true}
      TS_AUTHKEY: ${TS_AUTHKEY:-}

    volumes:
      - ts-state:/var/lib/tailscale
      - ${SITES_DIR:-./nginx/sites-enabled}:/etc/nginx/sites-enabled:ro
      - ${SSL_DIR:-./nginx/ssl}:/etc/nginx/ssl:ro

    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"

    restart: unless-stopped

volumes:
  ts-state:
    # 不写 name:，自动成为 <项目名>_ts-state，每个实例一份
